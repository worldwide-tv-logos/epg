# IPTV-EPG.org: one XMLTV file per country, guide IDs are mostly iptv-org IDs (TF1.fr).
# Files are behind a redirect (302) to a hashed path, followed by the downloader.

[provider]
name = "IPTV-EPG.org"
kind = "xmltv"
rank = 1
role = "main"

[[feed]]
id = "iptv-epg-fr"
url = "https://iptv-epg.org/files/epg-fr.xml.gz"
countries = ["fr"]
language = "fr"

