[project]
name = "worldwide-tv-epg"
version = "0.1.0"
description = "TV guides (EPG) aggregated from public sources, keyed by the channel IDs of worldwide-tv-logos"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
epg = "worldwide_tv_epg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldwide_tv_epg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
