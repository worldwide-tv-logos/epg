# One pass every 6 hours (docs/architecture.md): sources downloaded, mapped to the channel IDs of worldwide-tv-logos,
# merged and published: one XMLTV and one JSON guide per country and per day, on GitHub Pages (J-7 to J+7) and in
# one release per day (kept 30 days, also the archives of the past days).
# Nothing is committed: the repository holds only the code.
name: run
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
concurrency: run
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write      # daily releases
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: guides already published for the window (past days, and a source that fails keeps its channels)
        run: bash .github/scripts/releases.sh download archive "$(date -u -d '-7 days' +%F)" "$(date -u -d '+7 days' +%F)"
      - run: uv run epg run --archive archive --releases releases --out public
      - run: uv run epg check --out public
      - name: daily releases (new or changed country guides), releases older than 30 days deleted
        run: bash .github/scripts/releases.sh upload releases archive 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
