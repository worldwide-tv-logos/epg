# Guide sources, in order of preference: when two sources cover a channel equally well, the first one wins.
# `id` must match the source name used by the channel registry (guides.json of worldwide-tv-logos/database) so that
# its guide IDs are mapped to our channel IDs; a source unknown to the registry is matched by channel name only.
# `countries`: where the source's channels are looked for when matching by name.
# `language`: preferred language of titles and descriptions when a programme has several.

[[source]]
id = "iptv-epg-fr"
name = "IPTV-EPG.org France"
url = "https://iptv-epg.org/files/epg-fr.xml.gz"
countries = ["fr"]
language = "fr"

[[source]]
id = "xmltvfr"
name = "XML TV Fr"
url = "https://xmltvfr.fr/xmltv/xmltv.xz"
countries = ["fr", "be", "ch", "ca"]
language = "fr"

